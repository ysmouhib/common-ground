name: model-benchmark

# Runs a language model on FOLIO validation twice: answering directly, and
# formalizing so that the solver answers. Started by hand (Actions tab, "Run
# workflow"); it needs a repository secret named LLM_API_KEY. The numbers are
# whatever the model produces: the job summary and the uploaded files are the record.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "OpenAI-compatible endpoint, for example https://api.deepseek.com"
        required: true
        type: string
      model:
        description: "Model name as the provider spells it"
        required: true
        type: string
      limit:
        description: "Only the first N of the 204 examples (empty = all). Try 10 first."
        required: false
        type: string
      json_mode:
        description: "Send response_format=json_object (switch off if the provider rejects it)"
        required: false
        type: boolean
        default: true
      temperature:
        description: "Sampling temperature. Empty = send none (some models accept only their default)."
        required: false
        type: string
        default: "0"
      max_tokens:
        description: "Reply length limit per request"
        required: false
        type: string
        default: "2000"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FOLIO_REVISION: 5d7bb84c7edab3fb358e057d2807f19cf5cf5e2d
      # Inputs reach the shell as environment variables, never as script text.
      BASE_URL: ${{ inputs.base_url }}
      MODEL: ${{ inputs.model }}
      LIMIT: ${{ inputs.limit }}
      JSON_MODE: ${{ inputs.json_mode }}
      TEMPERATURE: ${{ inputs.temperature }}
      MAX_TOKENS: ${{ inputs.max_tokens }}
      OUT: ${{ github.workspace }}/model-benchmark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r engine/requirements.txt
      - name: Check that the key is there
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Add a repository secret named LLM_API_KEY (Settings, Secrets and variables, Actions)."
            exit 1
          fi
      - name: Fetch FOLIO at the revision the reference results were produced on
        run: |
          git clone --quiet https://github.com/Yale-LILY/FOLIO.git "$RUNNER_TEMP/FOLIO"
          git -C "$RUNNER_TEMP/FOLIO" checkout --quiet "$FOLIO_REVISION"
      - name: "Run the model twice: answering itself, then writing formulas for the solver"
        working-directory: engine
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -- --data "$RUNNER_TEMP/FOLIO" --base-url "$BASE_URL" --model "$MODEL" --max-tokens "${MAX_TOKENS:-2000}"
          if [ -n "$LIMIT" ]; then set -- "$@" --limit "$LIMIT"; fi
          if [ "$JSON_MODE" != "true" ]; then set -- "$@" --no-json-mode; fi
          if [ -n "$TEMPERATURE" ]; then set -- "$@" --temperature "$TEMPERATURE"; else set -- "$@" --no-temperature; fi
          for mode in direct llm; do
            echo "::group::$mode"
            python -m commonground folio "$@" --mode "$mode" --out "$OUT/$mode" > /dev/null
            echo "::endgroup::"
          done
      - name: Paired comparison and summary
        working-directory: engine
        run: |
          python -m commonground compare "$OUT/direct" "$OUT/llm" > "$OUT/comparison.json"
          python -m commonground report "$OUT/direct" "$OUT/llm" | tee "$OUT/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep every reply and verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-benchmark
          path: model-benchmark
          if-no-files-found: warn
